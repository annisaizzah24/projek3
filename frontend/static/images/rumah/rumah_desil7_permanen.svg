<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#42a5f5"/>
      <stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
    <linearGradient id="wallGrad7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eceff1"/>
      <stop offset="100%" stop-color="#cfd8dc"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#skyGrad7)"/>
  <!-- Lawn & Driveway -->
  <rect y="240" width="600" height="160" fill="#4caf50"/>
  <rect x="360" y="240" width="160" height="160" fill="#90a4ae"/>
  
  <!-- Fence -->
  <rect x="60" y="235" width="480" height="10" fill="#37474f"/>
  <rect x="60" y="220" width="8" height="25" fill="#37474f"/>
  <rect x="120" y="220" width="8" height="25" fill="#37474f"/>
  <rect x="180" y="220" width="8" height="25" fill="#37474f"/>
  <rect x="240" y="220" width="8" height="25" fill="#37474f"/>
  <rect x="300" y="220" width="8" height="25" fill="#37474f"/>

  <!-- Modern House Body -->
  <rect x="120" y="120" width="240" height="130" fill="url(#wallGrad7)" stroke="#90a4ae" stroke-width="2"/>
  <!-- Garage / Carport -->
  <rect x="360" y="140" width="150" height="110" fill="#b0bec5" stroke="#78909c" stroke-width="2"/>
  <!-- Garage Door -->
  <rect x="375" y="160" width="120" height="90" fill="#37474f"/>
  <line x1="375" y1="180" x2="495" y2="180" stroke="#546e7a" stroke-width="2"/>
  <line x1="375" y1="200" x2="495" y2="200" stroke="#546e7a" stroke-width="2"/>
  <line x1="375" y1="220" x2="495" y2="220" stroke="#546e7a" stroke-width="2"/>

  <!-- Modern Flat/Sloped Roof -->
  <polygon points="100,120 370,100 370,120 100,135" fill="#263238"/>
  <polygon points="350,140 520,130 520,145 350,155" fill="#37474f"/>

  <!-- Door & Glass Panels -->
  <rect x="150" y="160" width="50" height="90" fill="#4e342e" stroke="#2e1c14" stroke-width="2"/>
  <circle cx="190" cy="205" r="4" fill="#ffca28"/>

  <!-- Large Glass Windows with Frame -->
  <rect x="230" y="145" width="100" height="60" fill="#80deea" stroke="#00838f" stroke-width="3"/>
  <line x1="280" y1="145" x2="280" y2="205" stroke="#00838f" stroke-width="2"/>

  <!-- Air Conditioner Outdoor Unit -->
  <rect x="125" y="170" width="18" height="25" fill="#ffffff" stroke="#9e9e9e"/>
  <circle cx="134" cy="182" r="5" fill="#b0bec5"/>

  <!-- Label -->
  <rect x="20" y="20" width="240" height="36" rx="6" fill="#37474f" opacity="0.9"/>
  <text x="30" y="44" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">DESIL 7: MENENGAH CUKUP</text>
  <rect x="20" y="60" width="250" height="24" rx="4" fill="#ffffff" opacity="0.95"/>
  <text x="26" y="76" font-family="Arial, sans-serif" font-size="11" fill="#333333">Rumah Permanen Mewah / Mampu</text>
</svg>
