<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#e0f7fa"/>
    </linearGradient>
    <linearGradient id="groundGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#689f38"/>
      <stop offset="100%" stop-color="#33691e"/>
    </linearGradient>
    <linearGradient id="wallGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="100%" stop-color="#fff59d"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#skyGrad3)"/>
  <rect y="250" width="600" height="150" fill="url(#groundGrad3)"/>

  <!-- Paving path -->
  <polygon points="260,250 310,250 360,400 210,400" fill="#cfd8dc"/>

  <!-- House Body -->
  <rect x="140" y="150" width="320" height="110" fill="url(#wallGrad3)" stroke="#fbc02d" stroke-width="2"/>

  <!-- Roof -->
  <polygon points="110,155 300,75 490,155" fill="#d32f2f" stroke="#b71c1c" stroke-width="2"/>

  <!-- Door & Porch -->
  <rect x="220" y="175" width="55" height="85" fill="#6d4c41" stroke="#4e342e" stroke-width="2"/>
  <circle cx="265" cy="215" r="3" fill="#ffb74d"/>

  <!-- Windows with Curtains -->
  <rect x="320" y="175" width="90" height="50" fill="#e0f7fa" stroke="#546e7a" stroke-width="2"/>
  <line x1="365" y1="175" x2="365" y2="225" stroke="#546e7a" stroke-width="2"/>
  <line x1="320" y1="200" x2="410" y2="200" stroke="#546e7a" stroke-width="2"/>

  <!-- Label -->
  <rect x="20" y="20" width="220" height="36" rx="6" fill="#0288d1" opacity="0.9"/>
  <text x="30" y="44" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">DESIL 3: HAMPIR MISKIN</text>
  <rect x="20" y="60" width="230" height="24" rx="4" fill="#ffffff" opacity="0.95"/>
  <text x="26" y="76" font-family="Arial, sans-serif" font-size="11" fill="#333333">Rumah Sederhana Layak Terbatas</text>
</svg>
