<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#90caf9"/>
      <stop offset="100%" stop-color="#e3f2fd"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8d6e63"/>
      <stop offset="100%" stop-color="#5d4037"/>
    </linearGradient>
    <pattern id="bilikPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0,0 L 20,20 M 20,0 L 0,20" stroke="#a1887f" stroke-width="1.5"/>
    </pattern>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78909c"/>
      <stop offset="100%" stop-color="#546e7a"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="600" height="400" fill="url(#skyGrad)"/>
  
  <!-- Hills in background -->
  <path d="M 0,260 Q 150,220 300,250 T 600,230 L 600,400 L 0,400 Z" fill="#81c784" opacity="0.6"/>

  <!-- Ground / Soil -->
  <rect y="260" width="600" height="140" fill="url(#groundGrad)"/>
  <ellipse cx="300" cy="280" rx="260" ry="15" fill="#4e342e" opacity="0.3"/>

  <!-- House Body (Bilik Bambu / Kayu Lapuk) -->
  <rect x="140" y="160" width="320" height="110" fill="#d7ccc8" stroke="#8d6e63" stroke-width="3"/>
  <rect x="140" y="160" width="320" height="110" fill="url(#bilikPattern)" opacity="0.7"/>

  <!-- Bamboo Columns -->
  <rect x="140" y="150" width="14" height="120" fill="#a1887f" stroke="#6d4c41"/>
  <rect x="290" y="150" width="14" height="120" fill="#a1887f" stroke="#6d4c41"/>
  <rect x="446" y="150" width="14" height="120" fill="#a1887f" stroke="#6d4c41"/>

  <!-- Roof (Seng / Rumbia sederhana) -->
  <polygon points="100,165 300,80 500,165" fill="url(#roofGrad)" stroke="#37474f" stroke-width="3"/>
  <!-- Roof ridges -->
  <line x1="300" y1="80" x2="160" y2="165" stroke="#455a64" stroke-width="2"/>
  <line x1="300" y1="80" x2="230" y2="165" stroke="#455a64" stroke-width="2"/>
  <line x1="300" y1="80" x2="370" y2="165" stroke="#455a64" stroke-width="2"/>
  <line x1="300" y1="80" x2="440" y2="165" stroke="#455a64" stroke-width="2"/>

  <!-- Door (Pintu Kayu Sederhana) -->
  <rect x="210" y="185" width="55" height="85" fill="#8d6e63" stroke="#4e342e" stroke-width="2"/>
  <circle cx="255" cy="225" r="3" fill="#2e1c14"/>
  <line x1="210" y1="225" x2="265" y2="225" stroke="#6d4c41" stroke-width="1.5"/>

  <!-- Window (Jendela Bilik Kayu) -->
  <rect x="340" y="185" width="70" height="50" fill="#6d4c41" stroke="#4e342e" stroke-width="2"/>
  <rect x="345" y="190" width="60" height="40" fill="#cfd8dc" opacity="0.8"/>
  <line x1="375" y1="190" x2="375" y2="230" stroke="#4e342e" stroke-width="2"/>
  <line x1="345" y1="210" x2="405" y2="210" stroke="#4e342e" stroke-width="2"/>

  <!-- Soil / Patch Grass -->
  <path d="M 120,270 Q 140,265 160,270 T 200,270" stroke="#558b2f" stroke-width="4" fill="none"/>
  <path d="M 400,275 Q 430,270 460,275 T 490,275" stroke="#558b2f" stroke-width="4" fill="none"/>

  <!-- Tag Label -->
  <rect x="20" y="20" width="220" height="36" rx="6" fill="#b71c1c" opacity="0.9"/>
  <text x="30" y="44" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">DESIL 1: SANGAT MISKIN</text>
  <rect x="20" y="60" width="240" height="24" rx="4" fill="#ffffff" opacity="0.95"/>
  <text x="26" y="76" font-family="Arial, sans-serif" font-size="11" fill="#333333">Rumah Bilik Bambu / Lantai Tanah</text>
</svg>
