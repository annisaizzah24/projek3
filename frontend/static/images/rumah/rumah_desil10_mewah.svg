<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad10" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#90caf9"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#skyGrad10)"/>
  <rect y="230" width="600" height="170" fill="#388e3c"/>
  
  <!-- Swimming pool corner -->
  <rect x="380" y="280" width="220" height="120" fill="#00e5ff" rx="10"/>

  <!-- 2-Story Luxury Villa -->
  <rect x="80" y="80" width="360" height="170" fill="#ffffff" stroke="#37474f" stroke-width="2"/>
  <rect x="100" y="60" width="200" height="40" fill="#212121"/>
  
  <!-- Balcony 2nd Floor -->
  <rect x="90" y="140" width="220" height="15" fill="#cfd8dc"/>
  <rect x="90" y="125" width="220" height="15" fill="none" stroke="#37474f" stroke-width="2"/>

  <!-- 2nd Floor Glass Doors -->
  <rect x="110" y="90" width="70" height="45" fill="#80deea" stroke="#00838f"/>
  <rect x="210" y="90" width="70" height="45" fill="#80deea" stroke="#00838f"/>

  <!-- 1st Floor Entry & Large Windows -->
  <rect x="110" y="165" width="60" height="85" fill="#3e2723"/>
  <rect x="200" y="165" width="120" height="65" fill="#80deea" stroke="#00838f"/>
  
  <!-- Carport with Car silhouette -->
  <rect x="340" y="150" width="140" height="100" fill="#eceff1" stroke="#b0bec5"/>
  <ellipse cx="410" cy="225" rx="45" ry="18" fill="#d32f2f"/>
  <circle cx="380" cy="235" r="8" fill="#212121"/>
  <circle cx="440" cy="235" r="8" fill="#212121"/>

  <!-- Label -->
  <rect x="20" y="20" width="270" height="36" rx="6" fill="#212121" opacity="0.95"/>
  <text x="30" y="44" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">DESIL 10: SANGAT MAMPU</text>
  <rect x="20" y="60" width="270" height="24" rx="4" fill="#ffffff" opacity="0.95"/>
  <text x="26" y="76" font-family="Arial, sans-serif" font-size="11" fill="#333333">Rumah Mewah Bertingkat / Sangat Kaya</text>
</svg>
