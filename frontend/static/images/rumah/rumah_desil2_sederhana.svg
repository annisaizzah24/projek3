<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#81d4fa"/>
      <stop offset="100%" stop-color="#e1f5fe"/>
    </linearGradient>
    <linearGradient id="groundGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7cb342"/>
      <stop offset="100%" stop-color="#558b2f"/>
    </linearGradient>
    <linearGradient id="wallGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b0bec5"/>
      <stop offset="100%" stop-color="#78909c"/>
    </linearGradient>
    <linearGradient id="roofGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c62828"/>
      <stop offset="100%" stop-color="#8e0000"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#skyGrad2)"/>
  <rect y="260" width="600" height="140" fill="url(#groundGrad2)"/>

  <!-- Path to house -->
  <polygon points="260,260 290,260 340,400 210,400" fill="#bcaaa4"/>

  <!-- House Body (Bata Belum Diplester / Semi Kayu) -->
  <rect x="150" y="160" width="300" height="110" fill="url(#wallGrad2)" stroke="#546e7a" stroke-width="2"/>

  <!-- Roof -->
  <polygon points="120,165 300,90 480,165" fill="url(#roofGrad2)" stroke="#5f0909" stroke-width="2"/>

  <!-- Door -->
  <rect x="230" y="185" width="50" height="85" fill="#5d4037" stroke="#3e2723" stroke-width="2"/>
  <circle cx="270" cy="225" r="3" fill="#ffb74d"/>

  <!-- Windows -->
  <rect x="330" y="185" width="80" height="45" fill="#455a64" stroke="#263238" stroke-width="2"/>
  <rect x="335" y="190" width="70" height="35" fill="#b0bec5" opacity="0.9"/>
  <line x1="370" y1="190" x2="370" y2="225" stroke="#263238" stroke-width="2"/>

  <!-- Label -->
  <rect x="20" y="20" width="180" height="36" rx="6" fill="#e65100" opacity="0.9"/>
  <text x="30" y="44" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">DESIL 2: MISKIN</text>
  <rect x="20" y="60" width="220" height="24" rx="4" fill="#ffffff" opacity="0.95"/>
  <text x="26" y="76" font-family="Arial, sans-serif" font-size="11" fill="#333333">Rumah Sederhana Semi-Permanen</text>
</svg>
